services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: fluxgestion_db
    environment:
      POSTGRES_DB: ${DB_NAME:-fluxgestion_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache et broker Celery
  redis:
    image: redis:7-alpine
    container_name: fluxgestion_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluxgestion_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn fluxgestion.wsgi:application --config gunicorn_config.py"
    environment: &backend_env
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?definissez SECRET_KEY dans votre .env}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-fluxgestion_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      # Le proxy nginx termine TLS : sans lui, la redirection HTTPS boucle.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    # Pas de port publié : nginx atteint l'API par le réseau interne. La
    # publier ouvrirait une seconde porte d'entrée, sans TLS ni journal du
    # proxy.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker Celery : alertes, métriques, exports
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluxgestion_worker
    command: celery -A fluxgestion worker -l info
    environment: *backend_env
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # Planificateur Celery : rapports quotidiens, nettoyage
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluxgestion_beat
    command: celery -A fluxgestion beat -l info
    environment: *backend_env
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # SPA servie par nginx
  frontend:
    image: nginx:alpine
    container_name: fluxgestion_frontend
    # Servie au travers du proxy, comme l'API.
    expose:
      - "80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Reverse proxy
  nginx:
    image: nginx:alpine
    container_name: fluxgestion_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
