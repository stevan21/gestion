[program:fluxgestion]
command=/path/to/fluxgestion/backend/venv/bin/gunicorn --workers 4 --bind 127.0.0.1:8000 fluxgestion.wsgi:application
directory=/path/to/fluxgestion/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/fluxgestion/gunicorn.log
environment=PATH="/path/to/fluxgestion/backend/venv/bin"

[program:fluxgestion-beat]
command=/path/to/fluxgestion/backend/venv/bin/celery -A fluxgestion beat -l info
directory=/path/to/fluxgestion/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/fluxgestion/celery-beat.log
environment=PATH="/path/to/fluxgestion/backend/venv/bin"

[program:fluxgestion-worker]
command=/path/to/fluxgestion/backend/venv/bin/celery -A fluxgestion worker -l info
directory=/path/to/fluxgestion/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/fluxgestion/celery-worker.log
numprocs=1
environment=PATH="/path/to/fluxgestion/backend/venv/bin"

[group:fluxgestion]
programs=fluxgestion,fluxgestion-beat,fluxgestion-worker
priority=999
