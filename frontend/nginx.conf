server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ressources immuables : polices et images peuvent être mises en cache long.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Le code de l'application change à chaque déploiement : on le revalide
    # systématiquement, sinon un navigateur garderait une version obsolète.
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Les pages HTML ne sont jamais mises en cache.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Pages réelles servies telles quelles, repli sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers cachés inaccessibles
    location ~ /\. {
        deny all;
    }
}
