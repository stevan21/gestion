# Flux Gestion — vhost nginx.
#
# La SPA et l'API partagent la même origine : le navigateur n'a donc aucune
# requête préalable CORS à faire, et `frontend/config.js` vise `/api` sans
# port explicite. Certbot ajoute lui-même le bloc TLS et la redirection.

server {
    listen 80;
    listen [::]:80;
    server_name fluxgestion.76.13.146.34.sslip.io;

    client_max_body_size 20M;

    access_log /var/log/nginx/fluxgestion.access.log;
    error_log /var/log/nginx/fluxgestion.error.log;

    # --- Fichiers statiques de Django (administration) ---
    location /static/ {
        alias /opt/fluxgestion/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # --- API et administration : servies par gunicorn ---
    location ~ ^/(api|admin)/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/fluxgestion/gunicorn.sock;
        proxy_read_timeout 120;
    }

    # --- La SPA, servie telle quelle ---
    location / {
        root /opt/fluxgestion/frontend;
        index login.html;

        # Le code change à chaque déploiement : il se revalide, sinon un
        # navigateur garderait une version obsolète après une mise à jour.
        location ~* \.(js|css|html)$ {
            root /opt/fluxgestion/frontend;
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # L'application n'a pas de routage par URL : une adresse inconnue
        # revient à la page de connexion plutôt qu'à un 404 nu.
        try_files $uri $uri/ /login.html;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Fichiers cachés inaccessibles.
    location ~ /\. {
        deny all;
    }
}
